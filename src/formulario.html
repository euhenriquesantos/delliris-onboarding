<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2b0000">
<meta name="robots" content="noindex, nofollow">
<title>Roteiro de Inauguração — Dell'Iris</title>
<link rel="icon" href="/img/logo.webp">
<link rel="apple-touch-icon" href="/img/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bordo: #630b0b;
    --dark: #2b0000;
    --green: #0c7b12;
    /* Clareado a partir do verde da marca: o tom original não tem contraste
       suficiente sobre o bordô para texto e barra de progresso. */
    --green-claro: #4fc25c;
    --white: #ffffff;
    --soft: rgba(255,255,255,.78);
    --mut: rgba(255,255,255,.55);
    --card-bg: rgba(43,0,0,.49);
    --card-border: rgba(255,255,255,.85);
    --linha: rgba(255,255,255,.22);
    --erro: #ff9d9d;
    --radius: 16px;
    --pill: 42px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bordo);
    color: var(--white);
    margin: 0;
    padding: 0 0 2.5rem;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }

  /* ===== BARRA SUPERIOR ===== */
  .topo {
    position: sticky; top: 0; z-index: 50;
    background: var(--dark);
    border-bottom: 1px solid rgba(255,255,255,.15);
    padding-top: env(safe-area-inset-top);
  }
  .topo-inner {
    max-width: 760px; margin: 0 auto; padding: 12px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .topo img { width: 40px; height: 40px; border-radius: 11px; object-fit: cover; flex-shrink: 0; }
  .topo .tt { flex: 1; min-width: 0; }
  .topo .tt strong {
    display: block; font-family: "Roboto", sans-serif; font-weight: 700;
    font-size: 15px; line-height: 1.25; color: var(--white);
  }
  .topo .tt span {
    font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--mut);
  }
  .topo .contador {
    font-size: 12px; font-weight: 700; color: var(--white);
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.35);
    padding: 5px 12px; border-radius: 999px; white-space: nowrap;
  }
  .topo-bar { height: 3px; background: rgba(255,255,255,.15); }
  .topo-bar > div {
    height: 100%; width: 0%; background: var(--green-claro);
    transition: width .25s ease;
  }

  /* ===== CABEÇALHO ===== */
  .intro { padding: 26px 0 18px; }
  .intro h1 {
    font-family: "Roboto", sans-serif; font-weight: 400;
    font-size: clamp(24px, 5.6vw, 32px); line-height: 1.25; margin: 0 0 8px;
    text-wrap: balance;
  }
  .intro h1 em { font-style: italic; }
  .intro p { margin: 0; font-size: 14.5px; color: var(--soft); max-width: 52ch; }

  /* ===== CARTÕES ===== */
  .card {
    background: var(--card-bg);
    border: 2px solid var(--card-border);
    border-radius: var(--radius);
    padding: 20px 18px;
    margin-bottom: 14px;
  }
  .setup { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .setup .full { grid-column: 1 / -1; }

  label.field-label {
    font-size: 12px; font-weight: 600; letter-spacing: .3px;
    color: var(--soft); display: block; margin-bottom: 6px;
  }
  .req::after { content: " *"; color: var(--erro); }

  input[type=text], input[type=date], input[type=number], textarea {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid transparent;
    border-radius: 12px;
    background: var(--white);
    color: var(--dark);
    font-size: 15px;
    font-family: inherit;
    -webkit-appearance: none;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--green-claro); }
  input::placeholder, textarea::placeholder { color: rgba(43,0,0,.42); }
  input.invalid { border-color: var(--erro); }
  textarea { resize: vertical; line-height: 1.5; }

  /* ===== SEÇÕES ===== */
  .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .card-header .num {
    width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
    background: var(--white); color: var(--bordo);
    display: flex; align-items: center; justify-content: center;
    font-family: "Roboto", sans-serif; font-weight: 700; font-size: 17px;
  }
  .card-header .title {
    flex: 1; min-width: 0;
    font-family: "Roboto", sans-serif; font-weight: 500; font-size: 16.5px; line-height: 1.3;
  }
  .card-header .progress {
    font-size: 11px; font-weight: 700; color: var(--white); white-space: nowrap;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.35);
    padding: 4px 10px; border-radius: 999px;
  }
  .card-header .progress.completo {
    background: var(--green); border-color: var(--green-claro);
  }

  .check-row {
    display: flex; align-items: flex-start; gap: 11px;
    font-size: 14.5px; padding: 9px 0; cursor: pointer;
    border-top: 1px solid var(--linha);
  }
  .check-row:first-of-type { border-top: none; }
  .check-row input {
    -webkit-appearance: none; appearance: none;
    width: 23px; height: 23px; flex-shrink: 0; margin: 1px 0 0;
    border: 2px solid rgba(255,255,255,.7); border-radius: 7px;
    background: transparent; cursor: pointer; position: relative;
    transition: .15s;
  }
  .check-row input:checked { background: var(--white); border-color: var(--white); }
  .check-row input:checked::after {
    content: ""; position: absolute;
    left: 6px; top: 2px; width: 5px; height: 10px;
    border: solid var(--bordo); border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg);
  }
  .check-row input:focus-visible { outline: 2px solid var(--green-claro); outline-offset: 2px; }
  .check-row span { flex: 1; }
  .check-row span.done { color: var(--mut); text-decoration: line-through; }

  .obs-block { margin-top: 14px; }

  .photo-btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    padding: 11px 20px; border-radius: var(--pill);
    border: 2px solid rgba(255,255,255,.6); background: transparent; color: var(--white);
    transition: .18s;
  }
  .photo-btn:hover { background: var(--white); color: var(--bordo); border-color: var(--white); }
  .photo-acoes { display: flex; flex-wrap: wrap; gap: 10px; }
  .photo-acoes .photo-btn { flex: 1 1 auto; justify-content: center; min-width: 132px; }
  .photo-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .thumb-wrap { position: relative; width: 76px; height: 76px; }
  .thumb-wrap img {
    width: 76px; height: 76px; object-fit: cover;
    border-radius: 12px; border: 2px solid var(--card-border);
  }
  .thumb-remove {
    position: absolute; top: -7px; right: -7px;
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid var(--bordo); background: var(--white); color: var(--bordo);
    font-size: 12px; font-weight: 700; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* ===== BOTÕES ===== */
  .actions { display: grid; gap: 10px; margin-top: 22px; }
  button.primary, button.secondary {
    width: 100%; padding: 15px; border-radius: var(--pill);
    font-size: 16px; font-weight: 700; font-family: inherit;
    cursor: pointer; transition: .18s;
  }
  button.primary { border: 2px solid var(--white); background: var(--white); color: var(--bordo); }
  button.primary:hover:not(:disabled) { background: var(--green); border-color: var(--green); color: var(--white); }
  button.primary:disabled { opacity: .45; cursor: default; }
  button.secondary { border: 2px solid rgba(255,255,255,.6); background: transparent; color: var(--white); }
  button.secondary:hover { background: rgba(255,255,255,.12); border-color: var(--white); }

  /* ===== STATUS ===== */
  #status {
    display: none; margin-top: 16px;
    background: var(--card-bg); border: 2px solid var(--card-border);
    border-radius: var(--radius); padding: 16px 18px; font-size: 14px;
  }
  #status .msg { color: var(--soft); }
  #status.erro { border-color: var(--erro); }
  #status.erro .msg { color: var(--erro); }
  #status.ok { border-color: var(--green-claro); }
  #status.ok .msg { color: var(--green-claro); font-weight: 700; }
  .bar { height: 8px; background: rgba(255,255,255,.18); border-radius: 999px; overflow: hidden; margin-top: 12px; }
  .bar > div { height: 100%; width: 0%; background: var(--green-claro); transition: width .25s ease; }
  #status a {
    display: inline-block; margin-top: 10px;
    color: var(--bordo); background: var(--white);
    padding: 9px 20px; border-radius: var(--pill);
    font-weight: 700; text-decoration: none; font-size: 14px;
  }
  #status a:hover { background: var(--green); color: var(--white); }

  /* ===== PRÉVIA ===== */
  #report {
    display: none; margin-top: 22px;
    background: var(--card-bg); border: 2px solid var(--card-border);
    border-radius: var(--radius); padding: 22px 20px;
  }
  #report h2 {
    font-family: "Roboto", sans-serif; font-weight: 500; font-size: 20px; margin: 0 0 4px;
  }
  #report .meta { font-size: 13px; color: var(--soft); margin-bottom: 18px; }
  #report img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; border: 2px solid var(--card-border); }
  .report-item { font-size: 13.5px; margin-bottom: 3px; }
  .report-section { margin-bottom: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--linha); }
  .report-section:last-of-type { border-bottom: none; }
  .print-btn {
    margin-top: 16px; padding: 10px 22px; border-radius: var(--pill);
    border: 2px solid rgba(255,255,255,.6); background: transparent; color: var(--white);
    cursor: pointer; font-size: 14px; font-weight: 600; font-family: inherit;
  }

  /* ===== RODAPÉ ===== */
  .rodape {
    margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--linha);
    display: flex; align-items: center; gap: 12px; color: var(--mut); font-size: 12px;
  }
  .rodape img { width: 34px; height: 34px; border-radius: 9px; }
  .rodape .rb { font-family: "Roboto", sans-serif; font-weight: 700; color: var(--soft); font-size: 13px; }

  @media (max-width: 560px) {
    .setup { grid-template-columns: 1fr; }
    .card { padding: 18px 15px; }
  }

  @media print {
    body { background: #fff; color: #000; }
    .topo, .intro, .setup, .card, .actions, #status, .rodape { display: none !important; }
    #report {
      display: block !important; border: none; padding: 0; background: none; color: #000;
    }
    #report .meta, .report-item { color: #000; }
  }
</style>
</head>
<body>

<header class="topo">
  <div class="topo-inner">
    <img src="/img/logo.webp" alt="Dell'Iris">
    <div class="tt">
      <strong>Roteiro de inauguração</strong>
      <span>Comida que Abraça</span>
    </div>
    <div class="contador" id="contador-geral">0/24</div>
  </div>
  <div class="topo-bar"><div id="barra-geral"></div></div>
</header>

<div class="wrap">
  <div class="intro">
    <h1>Vistoria de campo, <em>passo a passo</em></h1>
    <p>Preencha seção por seção durante a inauguração. Ao enviar, o relatório em PDF e as fotos vão direto para a pasta da unidade no Drive.</p>
  </div>

  <div class="card setup">
    <div>
      <label class="field-label req">Unidade</label>
      <input type="text" id="f-unidade" placeholder="Ex: Dell'Iris Londrina Centro">
    </div>
    <div>
      <label class="field-label req">Responsável de campo</label>
      <input type="text" id="f-resp" placeholder="Nome">
    </div>
    <div>
      <label class="field-label req">Data</label>
      <input type="date" id="f-data">
    </div>
    <div>
      <label class="field-label">Nota geral do dia (0-10)</label>
      <input type="number" id="f-nota" min="0" max="10" placeholder="0 a 10">
    </div>
  </div>

  <div id="sections"></div>

  <div class="actions">
    <button class="primary" id="btn-enviar">Enviar para o Drive</button>
    <button class="secondary" id="btn-gerar">Ver prévia do relatório</button>
    <button class="secondary" id="btn-baixar">Baixar PDF no aparelho</button>
  </div>

  <div id="status"><div class="msg"></div><div class="bar"><div></div></div></div>

  <div id="report"></div>

  <div class="rodape">
    <img src="/img/logo.webp" alt="">
    <div>
      <div class="rb">Dell'Iris</div>
      <div>Roteiro de inauguração — uso interno</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ------------------------------------------------------------------
   Esta página não guarda segredo nenhum de propósito: tudo que o
   navegador recebe é público para quem abrir o código-fonte.
   A URL e o segredo do Apps Script vivem nos secrets da Cloudflare,
   e as chamadas passam pela ponte /api.
------------------------------------------------------------------- */
const URL_API = '/api';

const SECTIONS = [
  {id:'s1', title:"1. Conhecer a operação", items:[
    'Chegada mínima 2h30 antes da abertura',
    'Apresentação ao licenciado e equipe',
    'Colaboradores presentes x escala prevista',
    'Abertura da loja no horário previsto'
  ], obs:true, photo:true},
  {id:'s2', title:'2. Verificar fluxo de trabalho', items:[
    'Fluxo de produção segue ficha técnica',
    'Divisão de funções definida (monta/despacha/atende)',
    'Dupla checagem antes do despacho',
    'Gargalos de fluxo identificados'
  ], obs:true, photo:true},
  {id:'s3', title:'3. Testar impressão', items:[
    'Teste impressão pedido balcão/cardápio próprio',
    'Teste impressão pedido via iFood',
    'Sem falha de papel, tinta ou corte',
    'Layout do cupom validado'
  ], obs:false, photo:true},
  {id:'s4', title:'4. Checar iFood no geral', items:[
    'Loja aberta e visível no app',
    'Tempo de entrega condizente',
    'Teste de pedido real realizado'
  ], obs:false, photo:true},
  {id:'s5', title:'5. Apresentar fichas de montagem', items:[
    'Fichas apresentadas para toda equipe',
    'Fichas impressas, atualizadas e fixadas',
    'Confirmação verbal da equipe',
    'Dúvidas de montagem esclarecidas'
  ], obs:false, photo:true},
  {id:'s6', title:'6. Acompanhar abertura e gargalos', items:[
    'Acompanhamento até fim do primeiro pico',
    'Tempo de preparo e despacho observado',
    'Cancelamentos, atrasos ou chamados registrados',
    'Gargalos operacionais sob volume identificados',
    'Alinhamento final com o licenciado feito'
  ], obs:true, photo:true, extra:[
    'Gargalos identificados durante o pico',
    'Ações imediatas tomadas em campo',
    'Pendências a acompanhar remotamente (CS)'
  ]}
];

const state = {};
SECTIONS.forEach(s => {
  state[s.id] = { checks: s.items.map(()=>false), obs:'', photos: [], extra: (s.extra||[]).map(()=>'') };
});

const container = document.getElementById('sections');

/* ---------------------- rascunho local ---------------------- */
const CHAVE_RASCUNHO = 'delliris-roteiro-rascunho';

function salvarRascunho(){
  try {
    const dados = { campos: lerCampos(), secoes: {} };
    SECTIONS.forEach(s => {
      const st = state[s.id];
      dados.secoes[s.id] = { checks: st.checks, obs: st.obs, extra: st.extra };
    });
    localStorage.setItem(CHAVE_RASCUNHO, JSON.stringify(dados));
  } catch(_) { /* quota cheia ou modo privado: ignora */ }
}

function carregarRascunho(){
  try {
    const bruto = localStorage.getItem(CHAVE_RASCUNHO);
    if (!bruto) return;
    const dados = JSON.parse(bruto);
    ['unidade','resp','data','nota'].forEach(k => {
      if (dados.campos && dados.campos[k]) document.getElementById('f-'+k).value = dados.campos[k];
    });
    SECTIONS.forEach(s => {
      const salvo = dados.secoes && dados.secoes[s.id];
      if (!salvo) return;
      const st = state[s.id];
      if (Array.isArray(salvo.checks)) salvo.checks.forEach((v,i) => { if (i < st.checks.length) st.checks[i] = !!v; });
      if (typeof salvo.obs === 'string') st.obs = salvo.obs;
      if (Array.isArray(salvo.extra)) salvo.extra.forEach((v,i) => { if (i < st.extra.length) st.extra[i] = v; });
    });
  } catch(_) {}
}

/* ---------------------- render ---------------------- */
function render(){
  container.innerHTML = '';
  SECTIONS.forEach(s => {
    const st = state[s.id];
    const done = st.checks.filter(Boolean).length;
    const card = document.createElement('div');
    card.className = 'card';

    const header = document.createElement('div');
    header.className = 'card-header';
    const partes = s.title.match(/^(\d+)\.\s*(.*)$/) || [null, '•', s.title];
    const completo = done === s.items.length ? ' completo' : '';
    header.innerHTML =
      '<span class="num">' + partes[1] + '</span>' +
      '<span class="title">' + partes[2] + '</span>' +
      '<span class="progress' + completo + '">' + done + '/' + s.items.length + '</span>';
    card.appendChild(header);

    s.items.forEach((item, i) => {
      const row = document.createElement('label');
      row.className = 'check-row';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = st.checks[i];
      cb.addEventListener('change', () => { st.checks[i] = cb.checked; salvarRascunho(); render(); });
      const span = document.createElement('span');
      span.textContent = item;
      if (st.checks[i]) span.className = 'done';
      row.appendChild(cb); row.appendChild(span);
      card.appendChild(row);
    });

    if (s.obs) {
      const obsBlock = document.createElement('div');
      obsBlock.className = 'obs-block';
      const obsLabel = document.createElement('label');
      obsLabel.className = 'field-label';
      obsLabel.textContent = 'Observações';
      const ta = document.createElement('textarea');
      ta.value = st.obs;
      ta.rows = 2;
      ta.placeholder = 'Anote o que observar aqui...';
      ta.addEventListener('input', () => { st.obs = ta.value; salvarRascunho(); });
      obsBlock.appendChild(obsLabel);
      obsBlock.appendChild(ta);
      card.appendChild(obsBlock);
    }

    if (s.extra) {
      s.extra.forEach((label, ei) => {
        const block = document.createElement('div');
        block.className = 'obs-block';
        const l = document.createElement('label');
        l.className = 'field-label';
        l.textContent = label;
        const ta = document.createElement('textarea');
        ta.value = st.extra[ei];
        ta.rows = 2;
        ta.addEventListener('input', () => { st.extra[ei] = ta.value; salvarRascunho(); });
        block.appendChild(l);
        block.appendChild(ta);
        card.appendChild(block);
      });
    }

    if (s.photo) {
      const photoWrap = document.createElement('div');
      photoWrap.className = 'obs-block';
      const botoes = document.createElement('div');
      botoes.className = 'photo-acoes';

      /**
       * Dois botões em vez de um: `capture` abre a câmera direto e esconde a
       * galeria, então um botão só nunca dá as duas opções. O da galeria não
       * usa `capture` e aceita várias fotos de uma vez.
       */
      function criarBotao(rotulo, aoEscolher){
        const label = document.createElement('label');
        label.className = 'photo-btn';
        label.innerHTML = rotulo;
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.style.display = 'none';
        aoEscolher(input);
        input.addEventListener('change', async (e) => {
          const arquivos = Array.from(e.target.files || []);
          e.target.value = '';
          if (!arquivos.length) return;
          const original = label.innerHTML;
          label.innerHTML = '⏳ Processando...';
          for (const file of arquivos) {
            try { st.photos.push(await processarFoto(file)); }
            catch (err) { alert('Não consegui ler a foto "' + file.name + '": ' + err.message); }
          }
          label.innerHTML = original;
          render();
        });
        label.appendChild(input);
        botoes.appendChild(label);
      }

      criarBotao('📷 Tirar foto', input => { input.capture = 'environment'; });
      criarBotao('🖼 Da galeria', input => { input.multiple = true; });
      photoWrap.appendChild(botoes);

      if (st.photos.length) {
        const grid = document.createElement('div');
        grid.className = 'photo-grid';
        st.photos.forEach((foto, pi) => {
          const thumbWrap = document.createElement('div');
          thumbWrap.className = 'thumb-wrap';
          const img = document.createElement('img');
          img.src = foto.dataUrl;
          const rm = document.createElement('button');
          rm.className = 'thumb-remove';
          rm.textContent = '✕';
          rm.setAttribute('aria-label', 'Remover foto');
          rm.addEventListener('click', () => { st.photos.splice(pi,1); render(); });
          thumbWrap.appendChild(img); thumbWrap.appendChild(rm);
          grid.appendChild(thumbWrap);
        });
        photoWrap.appendChild(grid);
      }
      card.appendChild(photoWrap);
    }

    container.appendChild(card);
  });
  atualizarGeral();
}

/** Barra e contador da barra superior: o avanço fica visível sem rolar a tela. */
function atualizarGeral(){
  const feitos = SECTIONS.reduce((soma, s) => soma + state[s.id].checks.filter(Boolean).length, 0);
  const total = SECTIONS.reduce((soma, s) => soma + s.items.length, 0);
  document.getElementById('contador-geral').textContent = feitos + '/' + total;
  document.getElementById('barra-geral').style.width = (total ? (feitos / total) * 100 : 0) + '%';
}

/* ---------------------- fotos ---------------------- */
const FOTO_MAX_LADO = 1600;
const FOTO_QUALIDADE = 0.72;

async function processarFoto(file){
  let fonte;
  try {
    fonte = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch (_) {
    fonte = await new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('formato não suportado')); };
      img.src = url;
    });
  }
  let w = fonte.width || fonte.naturalWidth;
  let h = fonte.height || fonte.naturalHeight;
  const escala = Math.min(1, FOTO_MAX_LADO / Math.max(w, h));
  w = Math.max(1, Math.round(w * escala));
  h = Math.max(1, Math.round(h * escala));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(fonte, 0, 0, w, h);
  if (fonte.close) fonte.close();
  return { dataUrl: canvas.toDataURL('image/jpeg', FOTO_QUALIDADE), w, h };
}

/* ---------------------- utilidades ---------------------- */
function lerCampos(){
  return {
    unidade: document.getElementById('f-unidade').value.trim(),
    resp: document.getElementById('f-resp').value.trim(),
    data: document.getElementById('f-data').value,
    nota: document.getElementById('f-nota').value
  };
}

function slug(texto){
  return (texto || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-zA-Z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .toLowerCase() || 'sem-nome';
}

function pad2(n){ return String(n).padStart(2, '0'); }

function dataExtenso(iso){
  if (!iso) return '(não informado)';
  const [a, m, d] = iso.split('-');
  return d + '/' + m + '/' + a;
}

function totalFotos(){
  return SECTIONS.reduce((soma, s) => soma + state[s.id].photos.length, 0);
}

function gerarPdf(campos){
  const { jsPDF } = window.jspdf || {};
  if (!jsPDF) throw new Error('A biblioteca de PDF não carregou. Verifique a conexão e recarregue a página.');

  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const MARGEM = 15;
  const LARGURA = 210 - MARGEM * 2;
  const RODAPE = 282;
  let y = MARGEM;

  function novaPagina(){ doc.addPage(); y = MARGEM; }
  function espaco(altura){ if (y + altura > RODAPE) novaPagina(); }

  function texto(txt, opcoes){
    const o = opcoes || {};
    const tamanho = o.tamanho || 10;
    doc.setFont('helvetica', o.estilo || 'normal');
    doc.setFontSize(tamanho);
    doc.setTextColor.apply(doc, o.cor || [28, 28, 26]);
    const linhas = doc.splitTextToSize(String(txt), o.largura || LARGURA);
    const alturaLinha = tamanho * 0.42 + 1.2;
    linhas.forEach(linha => {
      espaco(alturaLinha);
      doc.text(linha, o.x || MARGEM, y + alturaLinha - 1.5);
      y += alturaLinha;
    });
  }

  function divisoria(){
    espaco(6);
    y += 2;
    doc.setDrawColor(214, 208, 206);
    doc.setLineWidth(0.2);
    doc.line(MARGEM, y, MARGEM + LARGURA, y);
    y += 4;
  }

  // Faixa bordô da marca, com o logo à direita.
  const ALTURA_FAIXA = 34;
  doc.setFillColor.apply(doc, BORDO);
  doc.rect(0, 0, 210, ALTURA_FAIXA, 'F');
  try { doc.addImage(LOGO_PDF, 'PNG', 210 - MARGEM - 20, 7, 20, 20); } catch (_) {}

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(17);
  doc.setTextColor(255, 255, 255);
  doc.text('Relatório de inauguração', MARGEM, 16);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.setTextColor(255, 255, 255);
  doc.text(doc.splitTextToSize(campos.unidade || '(unidade não informada)', LARGURA - 26)[0], MARGEM, 24);

  y = ALTURA_FAIXA + 10;

  texto(
    'Data: ' + dataExtenso(campos.data) +
    '   |   Responsável: ' + (campos.resp || '(não informado)') +
    '   |   Nota geral: ' + (campos.nota === '' ? '(não informada)' : campos.nota + '/10'),
    { tamanho: 9.5, cor: CINZA }
  );

  const feitos = SECTIONS.reduce((soma, s) => soma + state[s.id].checks.filter(Boolean).length, 0);
  const totalItens = SECTIONS.reduce((soma, s) => soma + s.items.length, 0);
  texto('Itens concluídos: ' + feitos + '/' + totalItens + '   |   Fotos anexadas: ' + totalFotos(),
    { tamanho: 9.5, cor: CINZA });
  divisoria();

  // Seções
  SECTIONS.forEach(s => {
    const st = state[s.id];
    const done = st.checks.filter(Boolean).length;
    espaco(16);
    // Marcador bordô à esquerda do título: dá ritmo visual ao documento.
    doc.setFillColor.apply(doc, BORDO);
    doc.rect(MARGEM, y + 0.5, 2.2, 5.4, 'F');
    texto(s.title + '  (' + done + '/' + s.items.length + ')',
      { tamanho: 12, estilo: 'bold', cor: BORDO, x: MARGEM + 5, largura: LARGURA - 5 });
    y += 1;

    s.items.forEach((item, i) => {
      const ok = st.checks[i];
      texto((ok ? '[x] ' : '[  ] ') + item, {
        tamanho: 10,
        cor: ok ? VERDE : VERMELHO
      });
    });

    if (st.obs) {
      y += 1.5;
      texto('Observações:', { tamanho: 9.5, estilo: 'bold', cor: BORDO });
      texto(st.obs, { tamanho: 10 });
    }

    if (s.extra) {
      s.extra.forEach((label, ei) => {
        if (!st.extra[ei]) return;
        y += 1.5;
        texto(label + ':', { tamanho: 9.5, estilo: 'bold', cor: BORDO });
        texto(st.extra[ei], { tamanho: 10 });
      });
    }

    if (st.photos.length) {
      y += 3;
      texto('Fotos (' + st.photos.length + '):', { tamanho: 9.5, estilo: 'bold', cor: BORDO });
      y += 1;
      const COLS = 3, GAP = 5, ALTURA_MAX = 55;
      const cel = (LARGURA - GAP * (COLS - 1)) / COLS;

      // Mede antes de desenhar: a legenda de todas as fotos da linha fica
      // na mesma altura, mesmo misturando foto em pé e deitada.
      const medidas = st.photos.map(foto => {
        const proporcao = (foto.h || 1) / (foto.w || 1);
        const alt = Math.min(cel * proporcao, ALTURA_MAX);
        return { foto: foto, alt: alt, larg: alt / proporcao };
      });

      for (let inicio = 0; inicio < medidas.length; inicio += COLS) {
        const linhaFotos = medidas.slice(inicio, inicio + COLS);
        const alturaLinha = Math.max.apply(null, linhaFotos.map(m => m.alt));
        espaco(alturaLinha + 7);
        const yLinha = y;
        linhaFotos.forEach((m, col) => {
          const x = MARGEM + col * (cel + GAP);
          try { doc.addImage(m.foto.dataUrl, 'JPEG', x, yLinha, m.larg, m.alt); } catch (_) {}
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(7);
          doc.setTextColor(136, 135, 128);
          doc.text('foto ' + pad2(inicio + col + 1), x, yLinha + alturaLinha + 3);
        });
        y = yLinha + alturaLinha + 6;
      }
    }

    divisoria();
  });

  // Rodapé
  const totalPaginas = doc.internal.getNumberOfPages();
  const carimbo = new Date();
  const carimboTxt = pad2(carimbo.getDate()) + '/' + pad2(carimbo.getMonth() + 1) + '/' + carimbo.getFullYear() +
    ' ' + pad2(carimbo.getHours()) + ':' + pad2(carimbo.getMinutes());
  for (let p = 1; p <= totalPaginas; p++) {
    doc.setPage(p);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.setTextColor(136, 135, 128);
    doc.text('Gerado em ' + carimboTxt, MARGEM, 290);
    doc.text('Página ' + p + ' de ' + totalPaginas, MARGEM + LARGURA, 290, { align: 'right' });
  }

  return doc;
}

function nomeArquivoPdf(campos){
  return 'relatorio-inauguracao-' + slug(campos.unidade) + '-' + (campos.data || 'sem-data') + '.pdf';
}

/* ---------------------- transporte (Drive) ---------------------- */
function chamarApi(acao, dados){
  return fetch(URL_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    body: JSON.stringify(Object.assign({ acao: acao }, dados))
  })
  .then(async r => {
    if (r.status === 401) {
      throw new Error('Sua sessão expirou. Recarregue a página e digite o código de novo — os dados preenchidos continuam aqui até você recarregar, então gere o PDF pelo botão "Baixar PDF no aparelho" antes.');
    }
    const txt = await r.text();
    let resp;
    try { resp = JSON.parse(txt); }
    catch (_) { throw new Error('Resposta inesperada do servidor.'); }
    if (!resp.ok) throw new Error(resp.erro || 'Falha no servidor');
    return resp;
  });
}

/* ---------------------- status ---------------------- */
const statusEl = document.getElementById('status');
const statusMsg = statusEl.querySelector('.msg');
const statusBar = statusEl.querySelector('.bar > div');

function status(texto, progresso, tipo){
  statusEl.style.display = 'block';
  statusEl.className = tipo || '';
  statusMsg.innerHTML = texto;
  statusBar.style.width = Math.round((progresso || 0) * 100) + '%';
}

const btnEnviar = document.getElementById('btn-enviar');

btnEnviar.addEventListener('click', async () => {
  const campos = lerCampos();

  const faltando = [];
  [['unidade','f-unidade'], ['resp','f-resp'], ['data','f-data']].forEach(([chave, id]) => {
    const el = document.getElementById(id);
    const vazio = !campos[chave];
    el.classList.toggle('invalid', vazio);
    if (vazio) faltando.push(chave === 'resp' ? 'responsável' : chave);
  });
  if (faltando.length) {
    status('Preencha antes de enviar: ' + faltando.join(', ') + '.', 0, 'erro');
    document.querySelector('.setup').scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  btnEnviar.disabled = true;
  const fotos = [];
  SECTIONS.forEach((s, si) => {
    state[s.id].photos.forEach((foto, pi) => {
      fotos.push({
        nome: pad2(si + 1) + '-' + slug(s.title.replace(/^\d+\.\s*/, '')) + '-' + pad2(pi + 1) + '.jpg',
        dataUrl: foto.dataUrl
      });
    });
  });
  const passos = fotos.length + 2;
  let passo = 0;
  const avanca = () => ++passo / passos;

  try {
    status('Gerando o PDF...', 0.02);
    const doc = gerarPdf(campos);
    const pdfBase64 = doc.output('datauristring');

    status('Criando a pasta da unidade no Drive...', avanca());
    const inicio = await chamarApi('iniciar', {
      unidade: campos.unidade,
      responsavel: campos.resp,
      data: campos.data,
      nota: campos.nota,
      totalFotos: fotos.length
    });

    for (let i = 0; i < fotos.length; i++) {
      status('Enviando foto ' + (i + 1) + ' de ' + fotos.length + '...', avanca());
      await chamarApi('foto', {
        pastaFotosId: inicio.pastaFotosId,
        nome: fotos[i].nome,
        dataUrl: fotos[i].dataUrl
      });
    }

    status('Enviando o relatório em PDF...', avanca());
    await chamarApi('pdf', {
      pastaVisitaId: inicio.pastaVisitaId,
      nome: nomeArquivoPdf(campos),
      dataUrl: pdfBase64
    });

    status(
      'Enviado com sucesso — ' + fotos.length + ' foto(s) + PDF.<br>' +
      '<a href="' + inicio.pastaVisitaUrl + '" target="_blank" rel="noopener">Abrir a pasta no Drive</a>',
      1, 'ok'
    );
    try { localStorage.removeItem(CHAVE_RASCUNHO); } catch (_) {}
  } catch (err) {
    status(
      'Não foi possível enviar: ' + err.message + '<br>' +
      'Os dados continuam preenchidos. Verifique a internet e tente de novo, ou use "Baixar PDF no aparelho".',
      0, 'erro'
    );
  } finally {
    btnEnviar.disabled = false;
  }
});

/* ---------------------- baixar PDF local ---------------------- */
document.getElementById('btn-baixar').addEventListener('click', () => {
  const campos = lerCampos();
  try {
    gerarPdf(campos).save(nomeArquivoPdf(campos));
  } catch (err) {
    status('Não consegui gerar o PDF: ' + err.message, 0, 'erro');
  }
});

/* ---------------------- prévia na tela ---------------------- */
document.getElementById('btn-gerar').addEventListener('click', () => {
  const campos = lerCampos();
  const unidade = campos.unidade || '(não informado)';
  const resp = campos.resp || '(não informado)';
  const data = campos.data ? dataExtenso(campos.data) : '(não informado)';
  const nota = campos.nota || '(não informado)';

  let html = '<h2>Relatório de inauguração</h2>';
  html += '<div class="meta">' + unidade + '<br>Data: ' + data + ' • Responsável: ' + resp + ' • Nota geral: ' + nota + '</div>';

  SECTIONS.forEach(s => {
    const st = state[s.id];
    const done = st.checks.filter(Boolean).length;
    html += '<div class="report-section">';
    html += '<div style="font-family:Roboto,sans-serif; font-weight:500; font-size:15px; margin-bottom:8px;">' + s.title + ' <span style="color:var(--mut); font-weight:400;">(' + done + '/' + s.items.length + ')</span></div>';
    s.items.forEach((item,i) => {
      const color = st.checks[i] ? 'var(--soft)' : 'var(--erro)';
      const mark = st.checks[i] ? '✓' : '✗';
      html += '<div class="report-item" style="color:' + color + ';">' + mark + ' ' + item + '</div>';
    });
    if (st.obs) html += '<div style="font-size:13px; margin-top:8px;"><span style="color:var(--mut);">Obs:</span> ' + st.obs + '</div>';
    if (s.extra) s.extra.forEach((label, ei) => {
      if (st.extra[ei]) html += '<div style="font-size:13px; margin-top:6px;"><span style="color:var(--mut);">' + label + ':</span> ' + st.extra[ei] + '</div>';
    });
    if (st.photos.length) {
      html += '<div class="photo-grid">';
      st.photos.forEach(foto => { html += '<img src="' + foto.dataUrl + '">'; });
      html += '</div>';
    }
    html += '</div>';
  });

  const total = totalFotos();
  html += '<div style="font-size:12px; color:var(--mut); margin-top:8px;">' + total + ' foto' + (total===1?'':'s') + ' anexada' + (total===1?'':'s') + ' no total.</div>';
  html += '<button class="print-btn" onclick="window.print()">🖨 Imprimir</button>';

  const reportEl = document.getElementById('report');
  reportEl.innerHTML = html;
  reportEl.style.display = 'block';
  reportEl.scrollIntoView({behavior:'smooth', block:'start'});
});

/* ---------------------- boot ---------------------- */
carregarRascunho();
if (!document.getElementById('f-data').value) {
  const hoje = new Date();
  document.getElementById('f-data').value = hoje.getFullYear() + '-' + pad2(hoje.getMonth()+1) + '-' + pad2(hoje.getDate());
}
['f-unidade','f-resp','f-data','f-nota'].forEach(id => {
  document.getElementById(id).addEventListener('input', salvarRascunho);
});
render();
</script>
</body>
</html>
